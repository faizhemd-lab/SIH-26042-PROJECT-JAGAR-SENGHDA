name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Prepare Assets & Configure Android Platform
        run: |
          cd mobile_app
          mkdir -p assets/db assets/models
          
          # 1. Generate clean Android platform files
          flutter create --platforms=android --org com.jagarsenghda .

          # 2. Safely update build.gradle via Python to guarantee correct block scope
          python3 -c "
          import re

          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              code = f.read()

          # Update SDK versions & Java 17 target
          code = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 34', code)
          code = re.sub(r'compileSdk\s*=.*', 'compileSdk = 34', code)
          code = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 23', code)
          code = re.sub(r'minSdk\s*=.*', 'minSdk = 23', code)
          code = re.sub(r'JavaVersion\.VERSION_1_8', 'JavaVersion.VERSION_17', code)

          # Enable core library desugaring inside compileOptions
          if 'compileOptions {' in code:
              code = code.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')

          # Append proper dependencies block at the end of file
          code += '\n\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n'

          with open(path, 'w') as f:
              f.write(code)
          "

          # 3. Configure Gradle properties for AndroidX and runner JVM memory
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

          yes | flutter doctor --android-licenses || true
          flutter pub get

      - name: Build Android Debug APK
        run: |
          cd mobile_app
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jagar-senghda-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
