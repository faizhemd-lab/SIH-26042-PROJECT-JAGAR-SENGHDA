name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding
        run: |
          cd mobile_app
          mkdir -p assets/db assets/models
          flutter create --platforms=android --org com.jagarsenghda .

      - name: Force Upgrade Root AGP to 8.2.1, Gradle to 8.2, and Enable Java 17
        run: |
          # 1. Overwrite Gradle Wrapper to version 8.2
          cat << 'EOF' > mobile_app/android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-all.zip
          EOF

          # 2. Overwrite ROOT build.gradle to upgrade AGP from 7.3.0 to 8.2.1
          cat << 'EOF' > mobile_app/android/build.gradle
          buildscript {
              ext.kotlin_version = '1.9.22'
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          # 3. Overwrite APP build.gradle with AGP 8 syntax & Java 17 desugaring
          cat << 'EOF' > mobile_app/android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.jagarsenghda"
              compileSdk = 34

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled true
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              defaultConfig {
                  applicationId "com.jagarsenghda"
                  minSdk = 23
                  targetSdk = 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          flutter {
              source '../..'
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
          }
          EOF

      - name: Build Android Debug APK
        run: |
          cd mobile_app
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

          yes | flutter doctor --android-licenses || true
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jagar-senghda-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
