name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Prepare Assets & Android Platform Scaffolding
        run: |
          cd mobile_app
          mkdir -p assets/db assets/models
          
          # Generate Android platform files
          flutter create --platforms=android --org com.jagarsenghda .
          
          # Set minSdkVersion to 23 and compileSdkVersion to 34
          sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdk.*/minSdk = 23/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/compileSdk.*/compileSdk = 34/g' android/app/build.gradle || true

          # Upgrade Java target compatibility from 1.8 to 17 for sealed class support in record_android
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' android/app/build.gradle || true

          # Enable Core Library Desugaring for D8 compiler
          sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle || true
          sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' android/app/build.gradle || true
          
          # Configure AndroidX & Gradle properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

          yes | flutter doctor --android-licenses || true
          flutter pub get

      - name: Build Android Debug APK
        run: |
          cd mobile_app
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jagar-senghda-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
